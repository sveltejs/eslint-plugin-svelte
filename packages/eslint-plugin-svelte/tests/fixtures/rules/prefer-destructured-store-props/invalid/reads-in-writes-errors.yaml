- message: Destructure foo from $store for better change tracking & fewer redraws
  line: 8
  column: 15
  suggestions:
    - desc: Using destructuring like const { foo } = $derived($store); will run faster
      messageId: fixUseDerivedDestructuring
      output: |
        <svelte:options runes />
        <script>
        	import { writable } from 'svelte/store';
        	const store = writable({ foo: 1, key: 'foo' });
        	let target = {};
        const { foo } = $derived($store);
        </script>
        <button onclick={() => {
        	$store.foo = foo + 1;
        	target[$store.key] = 1;
        	({ [$store.key]: target.foo } = {});
        	[target.foo = $store.foo] = [];
        	for (target.foo of [$store.foo]) {}
        }}>Update</button>
