- message: Prefer using writable $derived instead of $state and $effect
  line: 3
  column: 6
  suggestions:
    - desc: Rewrite $state and $effect to $derived
      messageId: suggestRewrite
      output: >
        <script>
        	const { data } = $props();
        	let user = $derived(data.user);
        	;
        	const total = $derived(user.items.reduce((sum, item) => sum + item.price, 0));
        	const names = $derived.by(() => {
        		const result = [];
        		for (const item of user.items) result.push(item.name);
        		return result;
        	});
        	function getUser() {
        		return user;
        	}
        	function show(node, u) {
        		node.textContent = String(u.name);
        	}
        </script>


        <p use:show={user}>{getUser().name} {total} {names.length}</p>

        {#each user.items}
        	<p>item</p>
        {/each}

        <button onclick={() => user}>button</button>
