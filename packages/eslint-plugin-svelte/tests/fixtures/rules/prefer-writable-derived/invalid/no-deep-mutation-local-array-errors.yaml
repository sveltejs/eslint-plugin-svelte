- message: Prefer using writable $derived instead of $state and $effect
  line: 3
  column: 6
  suggestions:
    - desc: Rewrite $state and $effect to $derived
      messageId: suggestRewrite
      output: >
        <script>
        	const { data } = $props();
        	let user = $derived(data.user);
        	;
        	const ids = $derived(['a', 'b'].filter((id) => user.items.includes(id)));
        	const names = $derived(['a', 'b'].map((id) => user.byId[id].name));
        </script>


        <p>{ids.length} {names.join(', ')}</p>
