- message: Prefer using writable $derived instead of $state and $effect
  line: 3
  column: 6
  suggestions:
    - desc: Rewrite $state and $effect to $derived
      messageId: suggestRewrite
      output: |
        <script>
        	const { data } = $props();
        	let user = $derived(data.user);
        	;
        	const box = {};
        	box.user = user;
        	const list = [];
        	list.push(user);
        	const wrapper = { user };
        </script>

        <p>{box.user.name} {list[0].name} {wrapper.user.name}</p>
