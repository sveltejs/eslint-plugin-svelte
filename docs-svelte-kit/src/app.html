<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			try {
				const storedTheme = localStorage.getItem('eslint-plugin-svelte-theme');
				const theme =
					storedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			} catch {
				// Keep the light theme when browser storage is unavailable.
			}
		</script>
		%sveltekit.head%
		<meta name="description" content="ESLint plugin for Svelte using AST" />
		<link rel="icon" type="image/png" href="/eslint-plugin-svelte/favicon.png" />

		<meta property="og:type" content="website" />
		<meta
			property="og:image"
			content="https://sveltejs.github.io/eslint-plugin-svelte/favicon.png"
		/>
		<meta property="og:site_name" content="eslint-plugin-svelte" />
		<meta property="og:description" content="ESLint plugin for Svelte using AST" />
		<meta name="twitter:card" content="summary" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />
	</head>
	<body>
		<div id="svelte">%sveltekit.body%</div>
	</body>
</html>
